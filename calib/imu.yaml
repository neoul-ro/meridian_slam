# VN-100S-CR noise parameters (Kalibr IMU noise model)
# Source: 24h static Allan variance, bag imu_allan_20260807c (86,416s @ 100Hz, 8.64M samples)
# Analyzed with allan_ros2, tau range 0.1-8000s (stock period_max=1000 caps tau at 100s and
# throws away the long-tau data a 24h recording is recorded for -- patched to 80000).
# Measured bias instability: gyro 0.9-1.0 deg/hr, accel 1.7-3.5e-4 m/s^2 (spec: gyro <10 deg/hr).
# Note: gyro X shows a ~1000s periodic bump (ambient thermal cycling), so gyro random_walk is
# the least certain number here; accel Y/Z show a clean +1/2 slope region.
#Accelerometer
accelerometer_noise_density: 0.0018991490331489059 
accelerometer_random_walk: 0.00016083566625242938 

#Gyroscope
gyroscope_noise_density: 7.696269866190555e-05 
